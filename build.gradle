plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.1980suciono'

version = '1.0.0'

base {
    archivesName = 'HttpHandler2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
	//google() // <--- Wajib ada untuk Android library
    mavenCentral()
	//JitPack adalah layanan yang bisa mengubah repository GitHub secara otomatis menjadi bisa dibaca oleh Gradle.
	maven { url 'https://jitpack.io' } // <--- Biasanya, library dari GitHub menyediakan integrasi dengan layanan bernama JitPack. 
	
}

dependencies {

	implementation fileTree(dir: 'libs', include: ['*.jar'])
	
}


publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
