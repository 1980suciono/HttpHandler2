plugins {
    id 'java-library' // <--- ganti 'com.android.library' untuk Android library
    id 'maven-publish' // Wajib untuk JitPack
}

group = 'com.github.1980suciono' // ketentuan library jitpack.io sehingga penggunaanya dependencies adalah implementation 'com.github.1980suciono:HttpHandler2:1.0.0'
// Menentukan Version
version = '1.0.0'

base {
    archivesName = 'HttpHandler2'
}


//android { //<---  Wajib ada untuk Android library
//    namespace = 'com.indolibs.libs'
//    compileSdk = 35
//    defaultConfig {
//        minSdk = 21
//    }
//   compileOptions {
//        sourceCompatibility = JavaVersion.VERSION_17
//        targetCompatibility = JavaVersion.VERSION_17
//    }
//}


java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
	//google() // <--- Wajib ada untuk Android library
    mavenCentral()
	//JitPack adalah layanan yang bisa mengubah repository GitHub secara otomatis menjadi bisa dibaca oleh Gradle.
	maven { url 'https://jitpack.io' } // <--- Biasanya, library dari GitHub menyediakan integrasi dengan layanan bernama JitPack. 
	
}

dependencies {

	// Jika Anda punya file .jar eksternal di folder libs
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	
    // Tempel library baru Anda di sini via mavenCentral()
    //implementation 'com.google.code.gson:gson:2.10.1'
	
	// Library GitHub via JitPack untuk manipulasi Excel
    //implementation 'com.github.dhatim:fastexcel:0.15.3'
	
}

//kalo ada file kembar Gabungkan atau sertakan saja semuanya (INCLUDE),
//tasks.withType(AbstractCopyTask) {
//    duplicatesStrategy = DuplicatesStrategy.INCLUDE
//}

// Konfigurasi publikasi untuk JitPack
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

